<h1>示例站点</h1>
<p>这是一个用来试的网页，跟导入你自己的网页一模一样。你能看到这页，就说明：文件夹进来了、子文件夹进来了、页面之间的跳转也是通的。</p>
<ul>
  <li>点上面的「子文件夹」，能进到第二层</li>
  <li>点「说明」，看这站点的结构</li>
  <li>上面那条返回栏是 App 加的，不是网页里的</li>
</ul>
<div class="tip">如果点「子文件夹」报找不到文件，多半是导入时只选了几个文件，而不是整个文件夹。</div>
