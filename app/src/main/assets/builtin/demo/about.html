<h1>这个示例站点的结构</h1>
<p>导入时整个文件夹一起进来，内部长这样：</p>
<pre>示例站点/
├─ index.html        ← 首页
├─ 说明.html          ← 这一页
└─ sub/
   └─ 内容.html</pre>
<p>有 <code>index.html</code> 的文件夹，导入后会直接认它当首页。没有 index.html 也行，会挑第一个网页当入口。</p>
<p><a href="index.html">← 回首页</a></p>
